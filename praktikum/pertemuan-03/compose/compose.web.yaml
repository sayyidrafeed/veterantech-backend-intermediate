services:
  web:
    build: ./web
    image: veterantech-web-compose-p03:1
    environment:
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8086}:3000"
    networks: [app-net]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
